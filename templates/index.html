<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f7f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .chat-container {
            height: calc(100vh - 180px);
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 15px;
            background-color: #4285F4; /* Google blue */
            color: white;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dropdown-menu {
            min-width: 14rem;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 15px;
            border-radius: 10px;
            padding: 10px 15px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            background-color: #e1f5fe;
            color: #0c2e5a;
            align-self: flex-end;
            margin-left: auto;
        }
        .assistant-message {
            background-color: #f1f1f1;
            color: #333;
            align-self: flex-start;
            margin-right: auto;
        }
        .chat-input {
            padding: 15px;
            background-color: #f9f9f9;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .form-control:focus {
            border-color: #4285F4;
            box-shadow: 0 0 0 0.2rem rgba(66, 133, 244, 0.25);
        }
        .btn-primary {
            background-color: #4285F4;
            border-color: #4285F4;
        }
        .btn-primary:hover {
            background-color: #3367d6;
            border-color: #3367d6;
        }
        .typing-indicator {
            display: inline-block;
            padding: 5px 10px;
            background-color: #f1f1f1;
            border-radius: 10px;
            font-style: italic;
            color: #666;
            margin-bottom: 15px;
        }
        .model-badge {
            background-color: #34a853; /* Google green */
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: normal;
        }
        /* For code blocks */
        pre {
            background-color: #282c34;
            color: #abb2bf;
            padding: 12px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
        }
        code {
            font-family: 'Courier New', Courier, monospace;
            color: #d19a66;
        }
        .message pre {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="chat-container">
            <div class="chat-header">
                <h4><i class="fas fa-robot me-2"></i> Gemini Chatbot</h4>
                <div class="d-flex">
                    <span class="model-badge me-2" id="model-display">gemini-2.0-flash</span>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-light dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-cog"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                            <li><h6 class="dropdown-header">Change Model</h6></li>
                            {% for model in models %}
                            <li><a class="dropdown-item model-option" href="#" data-model="{{ model }}">{{ model }}</a></li>
                            {% endfor %}
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="clear-chat"><i class="fas fa-trash-alt me-2"></i> Clear Chat</a></li>
                            <li><a class="dropdown-item" href="#" id="save-chat"><i class="fas fa-save me-2"></i> Save Chat</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <div class="px-3 py-2">
                                    <label for="custom-filename" class="form-label">Save with custom filename:</label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control" id="custom-filename" placeholder="conversation">
                                        <button class="btn btn-primary" id="save-custom">Save</button>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message assistant-message">
                    <p>Hello! I'm Gemini, a helpful AI assistant. How can I assist you today?</p>
                </div>
                <!-- Messages will be added here -->
            </div>
            <div id="typing-indicator" class="typing-indicator ms-3 d-none">
                Gemini is thinking...
            </div>
            <div class="chat-input">
                <form id="chat-form">
                    <div class="input-group">
                        <input type="text" id="user-input" class="form-control" placeholder="Type your message here..." autocomplete="off">
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3 text-muted">
            <small>Powered by Google's Gemini AI models</small>
        </div>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Main JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get DOM elements
            const chatMessages = document.getElementById('chat-messages');
            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const typingIndicator = document.getElementById('typing-indicator');
            const clearChatBtn = document.getElementById('clear-chat');
            const saveChatBtn = document.getElementById('save-chat');
            const saveCustomBtn = document.getElementById('save-custom');
            const customFilename = document.getElementById('custom-filename');
            const modelOptions = document.querySelectorAll('.model-option');
            const modelDisplay = document.getElementById('model-display');
            
            // Get conversation ID from server
            const conversationId = "{{ conversation_id }}";
            
            // Current active model
            let currentModel = "{{ default_model }}";
            
            // Connect to Socket.IO
            const socket = io();
            
            // Handle connection
            socket.on('connect', function() {
                console.log('Connected to server');
            });
            
            // Handle disconnection
            socket.on('disconnect', function() {
                console.log('Disconnected from server');
                addSystemMessage('Disconnected from server. Please refresh the page.');
            });
            
            // Handle errors
            socket.on('error', function(data) {
                console.error('Error:', data.error);
                addSystemMessage(`Error: ${data.error}`);
                hideTypingIndicator();
            });
            
            // Handle incoming message chunks
            let currentAssistantMessage = null;
            
            socket.on('message_chunk', function(data) {
                if (data.conversation_id !== conversationId) return;
                
                if (!currentAssistantMessage) {
                    // Create new message element for assistant
                    currentAssistantMessage = document.createElement('div');
                    currentAssistantMessage.className = 'message assistant-message';
                    currentAssistantMessage.innerHTML = markdown.parse('');
                    chatMessages.appendChild(currentAssistantMessage);
                }
                
                // Update the message content with the new chunk
                const currentContent = currentAssistantMessage.getAttribute('data-raw-content') || '';
                const newContent = currentContent + data.chunk;
                currentAssistantMessage.setAttribute('data-raw-content', newContent);
                currentAssistantMessage.innerHTML = markdown.parse(newContent);
                
                // Scroll to bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
            
            // Handle message completion
            socket.on('message_complete', function(data) {
                if (data.conversation_id !== conversationId) return;
                
                hideTypingIndicator();
                currentAssistantMessage = null;
            });
            
            // Handle model changed
            socket.on('model_changed', function(data) {
                if (data.conversation_id !== conversationId) return;
                
                addSystemMessage(`Model changed to ${data.model}`);
                currentModel = data.model;
                modelDisplay.textContent = data.model;
            });
            
            // Handle conversation cleared
            socket.on('conversation_cleared', function(data) {
                if (data.conversation_id !== conversationId) return;
                
                // Clear messages except the welcome message
                chatMessages.innerHTML = `
                    <div class="message assistant-message">
                        <p>Hello! I'm Gemini, a helpful AI assistant. How can I assist you today?</p>
                    </div>
                `;
                addSystemMessage('Conversation cleared');
            });
            
            // Handle conversation saved
            socket.on('conversation_saved', function(data) {
                if (data.conversation_id !== conversationId) return;
                
                addSystemMessage(`Conversation saved to ${data.filename}`);
            });
            
            // Markdown parser setup
            const markdown = {
                parse: function(text) {
                    return marked.parse(text, {
                        breaks: true,
                        gfm: true
                    });
                }
            };
            
            // Add user message to chat
            function addUserMessage(message) {
                const messageElement = document.createElement('div');
                messageElement.className = 'message user-message';
                messageElement.textContent = message;
                chatMessages.appendChild(messageElement);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Add system message to chat (for notifications)
            function addSystemMessage(message) {
                const messageElement = document.createElement('div');
                messageElement.className = 'text-center my-2';
                messageElement.innerHTML = `<small class="text-muted bg-light px-2 py-1 rounded">${message}</small>`;
                chatMessages.appendChild(messageElement);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Show typing indicator
            function showTypingIndicator() {
                typingIndicator.classList.remove('d-none');
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Hide typing indicator
            function hideTypingIndicator() {
                typingIndicator.classList.add('d-none');
            }
            
            // Handle form submission
            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const message = userInput.value.trim();
                if (!message) return;
                
                // Add user message to chat
                addUserMessage(message);
                
                // Clear input
                userInput.value = '';
                
                // Show typing indicator
                showTypingIndicator();
                
                // Send message to server
                socket.emit('send_message', {
                    message: message,
                    conversation_id: conversationId,
                    model: currentModel
                });
            });
            
            // Handle clear chat button
            clearChatBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                socket.emit('clear_conversation', {
                    conversation_id: conversationId,
                    model: currentModel
                });
            });
            
            // Handle save chat button
            saveChatBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                socket.emit('save_conversation', {
                    conversation_id: conversationId
                });
            });
            
            // Handle save with custom filename
            saveCustomBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                const filename = customFilename.value.trim();
                if (!filename) {
                    addSystemMessage('Please enter a filename');
                    return;
                }
                
                socket.emit('save_conversation', {
                    conversation_id: conversationId,
                    filename: filename
                });
                
                // Clear input
                customFilename.value = '';
            });
            
            // Handle model options
            modelOptions.forEach(function(option) {
                option.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    const model = this.getAttribute('data-model');
                    
                    socket.emit('change_model', {
                        model: model,
                        conversation_id: conversationId
                    });
                });
            });
            
            // Focus input field
            userInput.focus();
        });
    </script>
</body>
</html>
